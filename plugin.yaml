name: kaggle-competitions
label: Kaggle Competitions
kind: plugin
version: 0.1.0
manifest_version: 2
api_version: 1
requires_hermes: ">=0.23.0"
author: Landen Jackson
homepage: https://github.com/landenjackson/hermes-kaggle-plugin
license: MIT
description: "Track Kaggle competitions from your agent: live submission status, score history, personal-best tracking, and new-score watch. Multi-competition — add any slug."
tags: [kaggle, competitions, dashboard, desktop, tracking]
requires_env:
  - name: KAGGLE_API_TOKEN
    secret: true
    description: "Kaggle API token. Optional if ~/.kaggle/kaggle.json exists — the CLI reads that itself."
python_dependencies:
  - "requests>=2.31,<3"
config_schema:
  competitions:
    type: list
    description: "Competition slugs to track, e.g. [google-verifiable-quantum-circuit-compilation]"
    default: []
provides_tools:
  - kaggle_list_submissions
  - kaggle_score_history
  - kaggle_watch
  - kaggle_leaderboard
desktop_surface: desktop/plugin.js
dashboard_api: dashboard/plugin_api.py
